<style>

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}

@media(max-width:800px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
label input,label select{display:block;width:100%;margin-top:4px}
input,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
.scanwrap{position:relative}
.scan{width:100%;font-size:18px;padding:14px 44px 14px 56px;border:2px solid var(--pri);border-radius:12px;background:#fff}
.scan::placeholder{color:#9aa69e}

.ac.on{display:block}
.ac-it{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.ac-it:last-child{border-bottom:0}
.ac-it.sel,.ac-it:hover{background:var(--pri2)}
.ac-it .c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:700;min-width:96px}
.ac-it .d{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.3}
.ac-it .s{font-size:12px;color:var(--mut);white-space:nowrap}
.ac-it mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
.ac-foot{padding:7px 14px;font-size:12px;color:var(--mut);background:#fafbfa}
.sugg{margin-top:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:8px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:middle}
tr.hl td{background:#fff8d6;transition:background 1s}
.num{text-align:right;white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.qty{white-space:nowrap}
.qty input{width:70px;text-align:center;padding:5px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.in-sm{width:80px;text-align:center;padding:5px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn,.primary,.ghost,.danger{border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:#fff}
.primary{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}

button:disabled{opacity:.45;cursor:not-allowed}

.link{border:0;background:none;color:var(--blu);cursor:pointer;padding:0;text-decoration:underline}

.muted{color:var(--mut)}.small{font-size:13px}
.empty{padding:24px;text-align:center;color:var(--mut)}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.b-SALIDA{background:var(--warn2);color:var(--warn)}
.b-DEVOLUCION{background:var(--pri2);color:var(--pri)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}

.keypad button:active{background:var(--pri2)}
.keypad .ok{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
#perr{min-height:24px;color:var(--err);margin-top:12px;font-weight:600}

/* ---- tablet vertical y celular ---- */
@media (max-width:900px){
  input,select,textarea{font-size:16px}
  .rt thead{display:none}
  .rt,.rt tbody{display:block;width:100%}
  .rt tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:end}
  .rt td.code{grid-column:1/-1;font-size:12px;color:var(--mut);margin-bottom:-6px}
  .rt td.code::before,.rt td.full[data-l^="Descrip"]::before{display:none!important}
  .rt td.full[data-l^="Descrip"]{font-weight:600}

  .rt td.act a,.rt td.act .link{padding:4px 0}
  .rt tr.hl{background:#fff8d6;margin:0 -8px;padding:12px 8px;border-radius:10px}
  .rt tr.hl td{background:none}
  .rt td{display:block;border:0;padding:0;text-align:left!important;white-space:normal}
  .rt td[data-l]:not(.act)::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:3px;font-weight:600}
  .rt td.full,.rt td.act{grid-column:1/-1}
  .rt td.full{font-size:15px}
  .rt td.act{display:flex;justify-content:flex-end;gap:8px}

  .rt td.act > div{flex-direction:row!important;flex:1;justify-content:flex-end}

@media (max-width:700px){

  main{padding:10px}

  .grid2{gap:12px}

  .toolbar>*{flex:1 1 140px}

}

<body>

<section id="login" hidden></section>
<div id="app" hidden>
  <header>
    <h1>Stock en Campo</h1><span class="sp"></span>
    <span id="who"></span>

    <button onclick="openPin(false)">Mi PIN</button>

</div>
<div id="modal"><div class="box"><button class="x close" onclick="closeModal()">✕</button><div id="mbody"></div></div></div>
<div id="toast"></div>
<div id="busy">Guardando…</div>

<script>
/* ===================== CONFIGURACIÓN ===================== */
const CFG = {
  SUPABASE_URL: 'https://iyiurvnwycodrlmwbeob.supabase.co',
  SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5aXVydm53eWNvZHJsbXdiZW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTk3MTksImV4cCI6MjEwNzQ3NTcxOX0.6JAP4BP01ffGHAJQvRGS2wmnmOhtjvb0Fw8QITw1pbE',
  DIAS_ALERTA: 7,            // días fuera del depósito para marcar alerta
  LARGO_CODIGO: 3,           // dígitos del código de usuario (001, 002…)
  INACTIVIDAD_MIN: 3,        // minutos sin uso → vuelve a la pantalla de PIN
  CERRAR_TRAS_OPERACION: true, // tras confirmar una salida/devolución, cierra la sesión del usuario
  EMPRESA: 'Grupo Empresario Pioneros'
};
/* ========================================================= */

const DEMO = !CFG.SUPABASE_URL || !CFG.SUPABASE_KEY;
const sb = DEMO ? null : supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const T = {P:'stk_productos', T:'stk_tecnicos', M:'stk_movimientos'};
const S = {
  productos:[], tecnicos:[], movs:[], user:null, tab:'salida',
  cart:[], sal:{tec:'',orden:'',cliente:'',obs:''},
  dev:{tec:'',items:{},obs:''}, cf:{estado:'pend',sel:new Set()},
  mf:{tipo:'',tec:'',q:'',desde:'',hasta:''}, pq:'', psel:new Set(), lastId:null
};

/* ---------- utilidades ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').trim().toUpperCase();
const fmtF = s => s ? new Date(s).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const fmtN = n => (+n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
const tecName = id => S.tecnicos.find(t => t.id === id)?.nombre || '';
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem('stkdemo_'+k)) ?? null }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem('stkdemo_'+k, JSON.stringify(v)) }catch(e){} },
  del(k){ try{ localStorage.removeItem('stkdemo_'+k) }catch(e){} }
};
function toast(msg, type){
  const d = document.createElement('div'); d.className = 't ' + (type||''); d.textContent = msg;
  document.getElementById('toast').appendChild(d); setTimeout(() => d.remove(), type==='err' ? 4500 : 2500);
}
let AC;
function beep(ok = true){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = ok ? 'sine' : 'square'; o.frequency.value = ok ? 1250 : 220; g.gain.value = .08;
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (ok ? .07 : .35));
  }catch(e){}
}
function busy(on){ document.getElementById('busy').style.display = on ? 'flex' : 'none'; }
async function save(fn){
  try{ busy(true); await fn(); }
  catch(e){ console.error(e); toast('Error: ' + (e.message || e), 'err'); }
  finally{ busy(false); }
}
function modal(html){ document.getElementById('mbody').innerHTML = html; document.getElementById('modal').style.display = 'flex'; labelTables(document.getElementById('mbody')); }
function closeModal(){ document.getElementById('modal').style.display = 'none'; const sc = document.getElementById('scan'); if(sc) sc.focus(); }
function genRem(pref){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${pref}-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

/* ---------- capa de datos (Supabase o demo local) ---------- */
const DB = {
  async all(t){
    if(DEMO) return LS.get(t) || [];
    let out = [], from = 0;
    while(true){
      const {data, error} = await sb.from(t).select('*').range(from, from + 999);
      if(error) throw error;
      out = out.concat(data); if(data.length < 1000) break; from += 1000;
    }
    return out;
  },
  async insert(t, rows){
    if(DEMO){
      const now = new Date().toISOString();
      const r = rows.map(x => ({id:uid(), created_at:now, ...x}));
      LS.set(t, (LS.get(t) || []).concat(r)); return r;
    }
    const {data, error} = await sb.from(t).insert(rows).select();
    if(error) throw error; return data;
  },
  async update(t, ids, patch){
    if(DEMO){ LS.set(t, (LS.get(t) || []).map(x => ids.includes(x.id) ? {...x, ...patch} : x)); return; }
    for(let i = 0; i < ids.length; i += 150){
      const {error} = await sb.from(t).update(patch).in('id', ids.slice(i, i+150));
      if(error) throw error;
    }
  },
  async upsertProductos(rows){
    if(DEMO){
      const a = LS.get(T.P) || [], idx = new Map(a.map((x,i) => [x.codigo, i]));
      rows.forEach(r => {
        if(idx.has(r.codigo)) a[idx.get(r.codigo)] = {...a[idx.get(r.codigo)], ...r};
        else { a.push({id:uid(), created_at:new Date().toISOString(), ...r}); idx.set(r.codigo, a.length-1); }
      });
      LS.set(T.P, a); return;
    }
    for(let i = 0; i < rows.length; i += 500){
      const {error} = await sb.from(T.P).upsert(rows.slice(i, i+500), {onConflict:'codigo'});
      if(error) throw error;
    }
  }
};

let PBY = {byId:new Map(), byCode:new Map()};
function indexProd(){
  PBY = {byId:new Map(), byCode:new Map()};
  S.productos.forEach(p => {
    PBY.byId.set(p.id, p);
    if(p.codigo) PBY.byCode.set(norm(p.codigo), p);
    if(p.codigo_barras) PBY.byCode.set(norm(p.codigo_barras), p);
  });
}
async function loadAll(){
  [S.productos, S.tecnicos, S.movs] = await Promise.all([DB.all(T.P), AUTH.tecnicos(), DB.all(T.M)]);
  S.movs.sort((a,b) => a.created_at < b.created_at ? -1 : 1);
  indexProd();
}
async function refresh(){ await save(loadAll); render(); toast('Datos actualizados'); }

/* ---------- lógica de material en campo (FIFO) ---------- */
function pendientes(){
  const by = new Map();
  for(const m of S.movs){
    const k = m.tecnico_id + '|' + m.producto_id;
    let o = by.get(k);
    if(!o){ o = {tecnico_id:m.tecnico_id, tecnico_nombre:m.tecnico_nombre, producto_id:m.producto_id, codigo:m.codigo, descripcion:m.descripcion, lots:[]}; by.set(k, o); }
    const q = +m.cantidad || 0;
    if(m.tipo === 'SALIDA') o.lots.push({cant:q, fecha:m.created_at, orden:m.orden, cliente:m.cliente});
    else if(m.tipo === 'DEVOLUCION' || m.tipo === 'CONSUMO'){
      let r = q;
      while(r > 1e-9 && o.lots.length){ const l = o.lots[0], t = Math.min(l.cant, r); l.cant -= t; r -= t; if(l.cant <= 1e-9) o.lots.shift(); }
    }
  }
  const uniq = a => [...new Set(a.filter(Boolean))].join(' / ');
  return [...by.values()].map(o => ({
    ...o,
    cant: o.lots.reduce((s,l) => s + l.cant, 0),
    desde: o.lots[0]?.fecha,
    dias: o.lots[0] ? Math.floor((Date.now() - new Date(o.lots[0].fecha)) / 864e5) : 0,
    orden: uniq(o.lots.map(l => l.orden)),
    cliente: uniq(o.lots.map(l => l.cliente))
  })).filter(o => o.cant > 1e-9);
}
function enCampoPorProd(){ const m = new Map(); pendientes().forEach(p => m.set(p.producto_id, (m.get(p.producto_id)||0) + p.cant)); return m; }
const pendCons = () => S.movs.filter(m => m.tipo === 'CONSUMO' && !m.synagro_cargado).length;

/* ---------- escaneo ---------- */
function findProduct(q){
  const exact = PBY.byCode.get(norm(q));
  if(exact) return {exact, cands:[]};
  const n = q.toLowerCase();
  const cands = S.productos.filter(p => (p.descripcion||'').toLowerCase().includes(n) || (p.codigo||'').toLowerCase().includes(n)).slice(0, 8);
  return {exact:null, cands};
}
const ICO_SCAN = `<svg class="scanico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8" stroke-width="1.6"/></svg>`;
function scanBox(ph){
  return `<div class="scanwrap" id="scanwrap">${ICO_SCAN}<input id="scan" class="scan" placeholder="${h(ph)}" autocomplete="off" spellcheck="false"><button class="scanclr" title="Borrar" onpointerdown="event.preventDefault();scanClear()">✕</button><div class="ac" id="ac"></div></div><div id="sugg" class="sugg"></div>`;
}
/* autocompletado: código empieza con → código contiene → descripción contiene todas las palabras */
const ACQ = {list:[], sel:-1, t:null};
function acSearch(q){
  q = q.trim(); if(!q) return [];
  const n = norm(q), words = q.toLowerCase().split(/\s+/).filter(Boolean), out = [];
  const pool = S.tab === 'devolucion' ? devPend().map(x => PBY.byId.get(x.producto_id)).filter(Boolean) : S.productos;
  for(const p of pool){
    const c = norm(p.codigo), b = norm(p.codigo_barras), d = (p.descripcion||'').toLowerCase();
    let r = -1;
    if(c === n || b === n) r = 0;
    else if(c.startsWith(n) || b.startsWith(n)) r = 1;
    else if(c.includes(n) || b.includes(n)) r = 2;
    else if(words.every(w => d.includes(w))) r = 3;
    if(r >= 0) out.push([r, p]);
  }
  out.sort((x,y) => x[0] - y[0] || String(x[1].codigo).length - String(y[1].codigo).length || String(x[1].codigo).localeCompare(String(y[1].codigo)));
  return out.map(x => x[1]);
}
function acMark(text, q){
  const t = String(text ?? ''); if(!q) return h(t);
  const i = t.toLowerCase().indexOf(q.toLowerCase()); if(i < 0) return h(t);
  return h(t.slice(0,i)) + '<mark>' + h(t.slice(i, i+q.length)) + '</mark>' + h(t.slice(i+q.length));
}
function acRender(){
  const box = document.getElementById('ac'), inp = document.getElementById('scan'); if(!box || !inp) return;
  const q = inp.value.trim();
  document.getElementById('scanwrap').classList.toggle('has', !!inp.value);
  if(!q || !ACQ.list.length){ box.classList.remove('on'); box.innerHTML = q ? '' : ''; if(q){ box.innerHTML = `<div class="ac-foot">Sin coincidencias para “${h(q)}”</div>`; box.classList.add('on'); } return; }
  const ec = enCampoPorProd(), shown = ACQ.list.slice(0, 8), word = q.split(/\s+/)[0];
  box.innerHTML = shown.map((p,i) => `<div class="ac-it ${i===ACQ.sel?'sel':''}" onpointerdown="event.preventDefault();acPick(${i})">
      <span class="c">${acMark(p.codigo, q)}</span><span class="d">${acMark(p.descripcion, word)}</span>
      <span class="s">${p.stock_synagro!=null?'Stock '+fmtN(p.stock_synagro):''}${ec.get(p.id)?' · '+fmtN(ec.get(p.id))+' en campo':''}</span></div>`).join('')
    + `<div class="ac-foot">${ACQ.list.length > 8 ? `${ACQ.list.length} coincidencias · seguí escribiendo para afinar · ` : ''}↑ ↓ para elegir · Enter para agregar</div>`;
  box.classList.add('on');
}
function acUpdate(){ const inp = document.getElementById('scan'); ACQ.list = acSearch(inp ? inp.value : ''); ACQ.sel = ACQ.list.length ? 0 : -1; acRender(); }
function acClose(){ ACQ.list = []; ACQ.sel = -1; const box = document.getElementById('ac'); if(box){ box.classList.remove('on'); box.innerHTML = ''; } }
function scanClear(){ const inp = document.getElementById('scan'); if(inp){ inp.value = ''; inp.focus(); } acClose(); document.getElementById('scanwrap')?.classList.remove('has'); }
function acPick(i){ const p = ACQ.list[i]; scanClear(); if(p) onProduct(p); }
function onScanInput(){ clearTimeout(ACQ.t); ACQ.t = setTimeout(acUpdate, 90); document.getElementById('sugg').innerHTML = ''; }
function onScanKey(e){
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(!ACQ.list.length) return; e.preventDefault();
    const n = Math.min(ACQ.list.length, 8); ACQ.sel = (ACQ.sel + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; acRender(); return;
  }
  if(e.key === 'Escape'){ scanClear(); return; }
  if(e.key !== 'Enter') return;
  e.preventDefault(); clearTimeout(ACQ.t);
  const v = e.target.value.trim(); if(!v) return;
  const sg = document.getElementById('sugg'); sg.innerHTML = '';
  // la pistola manda el código completo + Enter: si coincide exacto, va directo
  const exact = PBY.byCode.get(norm(v));
  if(exact){ scanClear(); return onProduct(exact); }
  const list = acSearch(v);
  if(list.length){ const p = list[Math.max(0, Math.min(ACQ.sel, list.length-1))]; scanClear(); return onProduct(p); }
  beep(false); scanClear(); toast(`Código “${v}” no encontrado`, 'err');
  sg.innerHTML = `<div class="muted small">El código “${h(v)}” no está en el catálogo. <button class="link" data-code="${h(v)}" onclick="editProd(null,this.dataset.code)">Darlo de alta</button></div>`;
}
function pickSugg(id){ const p = PBY.byId.get(id); if(p) onProduct(p); }
function onProduct(p){ if(S.tab === 'salida') addCart(p); else if(S.tab === 'devolucion') devScan(p); }

function labelTables(root){

/* ---------- DEVOLUCIÓN / CONSUMO ---------- */
function devTec(v){ S.dev = {tec:v, items:{}, obs:''}; render(); }
function devPend(){ return S.dev.tec ? pendientes().filter(p => p.tecnico_id === S.dev.tec).sort((a,b) => b.dias - a.dias) : []; }
function devIt(pid){ return S.dev.items[pid] || (S.dev.items[pid] = {dev:0, cons:0}); }
function devSet(pid, k, v){ devIt(pid)[k] = Math.max(0, +String(v).replace(',','.') || 0); render(); }
function devAll(pid, k){
  const p = devPend().find(x => x.producto_id === pid); if(!p) return;
  S.dev.items[pid] = {dev: k==='dev' ? p.cant : 0, cons: k==='cons' ? p.cant : 0}; render();
}
function devScan(prod){
  const p = devPend().find(x => x.producto_id === prod.id);
  if(!p){ beep(false); return toast(`“${prod.descripcion}” no figura en poder de ${tecName(S.dev.tec)}`, 'err'); }
  const it = devIt(prod.id);
  if(it.dev + it.cons + 1 > p.cant + 1e-9){ beep(false); return toast('Ya están asignadas todas las unidades pendientes de ese producto', 'err'); }
  it.dev++; S.lastId = prod.id; beep(); render();
}
function vDev(){
  if(!esAdmin() && S.dev.tec !== S.user.id) S.dev = {tec:S.user.id, items:{}, obs:''};
  const d = S.dev, pend = devPend(), D = CFG.DIAS_ALERTA;
  let body;
  if(!d.tec) body = `<div class="empty">Elegí el técnico que vuelve del campo para ver lo que tiene en su poder.</div>`;
  else if(!pend.length) body = `<div class="empty">${h(tecName(d.tec))} no tiene material pendiente de rendir. 👍</div>`;
  else {
    const rows = pend.map(p => { const it = d.items[p.producto_id] || {dev:0,cons:0}; const rest = p.cant - it.dev - it.cons;
      return `<tr class="${p.producto_id===S.lastId?'hl':''}"><td class="mono">${h(p.codigo)}</td><td>${h(p.descripcion)}<div class="muted small">${h([p.orden,p.cliente].filter(Boolean).join(' · '))}</div></td>
        <td><span class="badge ${p.dias>D?'b-late':'b-ok'}">${p.dias} d</span></td>
        <td class="num"><b>${fmtN(p.cant)}</b></td>
        <td><input class="in-sm" type="number" min="0" step="any" value="${it.dev}" onchange="devSet('${p.producto_id}','dev',this.value)"></td>
        <td><input class="in-sm" type="number" min="0" step="any" value="${it.cons}" onchange="devSet('${p.producto_id}','cons',this.value)"></td>
        <td class="num ${rest<-1e-9?'b-late':''}">${fmtN(rest)}</td>
        <td><div style="display:flex;flex-direction:column;gap:4px"><button class="btn sm" style="white-space:nowrap" onclick="devAll('${p.producto_id}','dev')">Volvió todo</button><button class="btn sm" style="white-space:nowrap" onclick="devAll('${p.producto_id}','cons')">Quedó en el cliente</button></div></td></tr>`; }).join('');
    body = `<div class="tw"><table class="rt"><thead><tr><th>Código</th><th>Descripción · orden/cliente</th><th>Afuera</th><th class="num">Pendiente</th><th>Vuelve al depósito</th><th>Quedó en el cliente –<br>a facturar</th><th class="num">Sigue en campo</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <label style="margin-top:12px">Observación<input value="${h(d.obs)}" oninput="S.dev.obs=this.value" placeholder="Ej: el sensor volvió dañado"></label>
      <p class="muted small">Lo que se marque como <b>quedó en el cliente – a facturar</b> pasa a la lista <b>A facturar</b> para que administración lo cargue en Synagro. Lo que no se complete sigue en poder del técnico.</p>
      <div class="actions"><button class="primary" onclick="confirmDev()">Confirmar</button></div>`;
  }
  return `<div class="grid2">
    <section class="card"><h3>1 · Técnico que rinde</h3>${tecCampo(d.tec, 'devTec(this.value)', 'Técnico')}</section>
    <section class="card"><h3>2 · Escanear lo que vuelve</h3>${d.tec ? scanBox('Escaneá cada repuesto que vuelve al depósito') : '<div class="muted">Primero elegí el técnico.</div>'}</section>
  </div><section class="card"><h3>3 · Material en poder del técnico</h3>${body}</section>`;
}
async function confirmDev(){
  const d = S.dev, pend = devPend(), tn = tecName(d.tec), rem = genRem('D'), rows = [];
  for(const p of pend){
    const it = d.items[p.producto_id]; if(!it) continue;
    if(it.dev + it.cons > p.cant + 1e-9) return toast(`${p.descripcion}: lo que vuelve + lo que quedó en el cliente supera lo pendiente`, 'err');
    const base = {remito:rem, producto_id:p.producto_id, codigo:p.codigo, descripcion:p.descripcion, tecnico_id:d.tec, tecnico_nombre:tn,
      usuario:S.user.nombre, operador_id:S.user.id||null, orden:p.orden||null, cliente:p.cliente||null, observacion:d.obs||null};
    if(it.dev > 0) rows.push({...base, tipo:'DEVOLUCION', cantidad:it.dev});
    if(it.cons > 0) rows.push({...base, tipo:'CONSUMO', cantidad:it.cons, synagro_cargado:false});
  }
  if(!rows.length) return toast('No marcaste nada como devuelto ni como quedó en el cliente', 'err');
  await save(async () => {
    const r = await DB.insert(T.M, rows);
    S.movs.push(...r); S.dev = {tec:d.tec, items:{}, obs:''}; S.lastId = null; render();
    askPrint(rem, `${tn}: ${rows.filter(x=>x.tipo==='DEVOLUCION').length} ítems devueltos al depósito y ${rows.filter(x=>x.tipo==='CONSUMO').length} que quedaron en el cliente (a facturar).`);
  });
}

/* ---------- BARRIDO para Synagro (administración, 1-2 veces por semana) ---------- */
let BAR = null;
function lotes(){
  const m = new Map();
  S.movs.filter(x => x.synagro_lote).forEach(x => {
    const o = m.get(x.synagro_lote) || {lote:x.synagro_lote, fecha:x.synagro_cargado_at, por:x.synagro_cargado_por, items:0, u:0};
    o.items++; o.u += +x.cantidad || 0; m.set(x.synagro_lote, o);
  });
  return [...m.values()].sort((a,b) => (a.fecha||'') < (b.fecha||'') ? 1 : -1);
}
function consolidar(ms){
  const m = new Map();
  ms.forEach(x => { const o = m.get(x.codigo) || {Codigo:x.codigo, Descripcion:x.descripcion, Cantidad:0}; o.Cantidad += +x.cantidad || 0; m.set(x.codigo, o); });
  return [...m.values()].sort((a,b) => String(a.Codigo).localeCompare(String(b.Codigo)));
}
function vBarrido(){
  const pend = S.movs.filter(m => m.tipo === 'CONSUMO' && !m.synagro_cargado), ls = lotes(), last = ls[0];
  const dias = last ? Math.floor((Date.now() - new Date(last.fecha)) / 864e5) : null;
  const u = pend.reduce((a,m) => a + (+m.cantidad||0), 0);
  return `<section class="card"><h3>Barrido para Synagro</h3>
    <p class="muted small">Una o dos veces por semana, administración junta todo lo que quedó en clientes y está pendiente, descarga el Excel, lo carga en Synagro y cierra el lote. Cada lote queda registrado con fecha y responsable.</p>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi ${pend.length?'alert':''}"><b>${pend.length}</b><span>ítems a facturar</span></div>
      <div class="kpi"><b>${fmtN(u)}</b><span>unidades a descargar</span></div>
      <div class="kpi ${dias!=null&&dias>7?'alert':''}"><b>${last ? (dias===0?'Hoy':`Hace ${dias} d`) : '—'}</b><span>último barrido${last?` (${h(last.por||'')})`:''}</span></div>
    </div>
    <div class="actions" style="margin-top:0"><button class="primary" onclick="openBarrido()" ${pend.length?'':'disabled'}>Hacer barrido</button></div>
    ${ls.length ? `<details style="margin-top:12px"><summary class="small">Lotes anteriores (${ls.length})</summary><div class="tw"><table class="rt"><thead><tr><th>Lote</th><th>Fecha</th><th>Hecho por</th><th class="num">Ítems</th><th class="num">Unidades</th><th></th></tr></thead><tbody>
      ${ls.slice(0,30).map(l => `<tr><td class="mono">${h(l.lote)}</td><td class="small">${fmtF(l.fecha)}</td><td>${h(l.por||'')}</td><td class="num">${l.items}</td><td class="num">${fmtN(l.u)}</td><td><button class="link" onclick="dlLote('${h(l.lote)}')">Descargar de nuevo</button></td></tr>`).join('')}
      </tbody></table></div></details>` : ''}
  </section>`;
}
function openBarrido(){
  const ms = S.movs.filter(m => m.tipo === 'CONSUMO' && !m.synagro_cargado);
  if(!ms.length) return toast('No hay ítems pendientes de facturar', 'err');
  BAR = {ids: ms.map(m => m.id), ms, lote: genRem('B'), bajado:false};
  const cons = consolidar(ms);
  modal(`<h3>Barrido ${h(BAR.lote)}</h3>
    <p class="small">${ms.length} ítems · ${cons.length} productos distintos · desde ${fmtF(ms[0].created_at)} hasta ${fmtF(ms[ms.length-1].created_at)}</p>
    <div class="tw" style="max-height:300px;overflow:auto"><table><thead><tr><th>Código</th><th>Descripción</th><th class="num">Cantidad</th></tr></thead><tbody>
    ${cons.map(c => `<tr><td class="mono">${h(c.Codigo)}</td><td>${h(c.Descripcion)}</td><td class="num">${fmtN(c.Cantidad)}</td></tr>`).join('')}</tbody></table></div>
    <ol class="small" style="margin:14px 0 0;padding-left:18px">
      <li><b>Descargá el Excel</b>: trae una hoja <b>por cliente</b> (para armar cada factura o remito), otra <b>por producto</b> (para descargar el stock) y el <b>detalle</b> completo.</li>
      <li><b>Cargalo en Synagro.</b></li>
      <li><b>Confirmá acá</b>: estos ítems quedan cerrados en el lote ${h(BAR.lote)}. Lo que se registre después entra en el próximo barrido.</li></ol>
    <div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="BAR.bajado=true;dlBarrido(BAR.ms,BAR.lote)">1 · Descargar Excel</button><button class="primary" onclick="confirmBarrido()">3 · Confirmar: ya está en Synagro</button></div>`);
}
function dlBarrido(ms, lote){
  const wb = XLSX.utils.book_new();
  const hoja = (rows, nombre, anchos) => { const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = anchos.map(w => ({wch:w})); XLSX.utils.book_append_sheet(wb, ws, nombre); };
  const ord = ms.slice().sort((a,b) => (a.cliente||'zzz').localeCompare(b.cliente||'zzz') || (a.orden||'').localeCompare(b.orden||'') || String(a.codigo).localeCompare(String(b.codigo)));
  // 1) por cliente: para armar factura / remito de cada uno
  hoja(ord.map(m => ({Cliente:m.cliente||'(sin cliente)', 'Orden de servicio':m.orden||'', Codigo:m.codigo, Descripcion:m.descripcion, Cantidad:+m.cantidad,
    Tecnico:m.tecnico_nombre, Fecha:fmtF(m.created_at), Observacion:m.observacion||''})), 'Por cliente', [28,16,14,48,10,22,16,30]);
  // 2) consolidado por producto: para descargar el stock en Synagro
  hoja(consolidar(ms), 'Por producto', [14,48,10]);
  // 3) detalle completo para control
  hoja(ms.map(m => ({Fecha:fmtF(m.created_at), Tecnico:m.tecnico_nombre, Cliente:m.cliente||'', Orden:m.orden||'', Codigo:m.codigo, Descripcion:m.descripcion,
    Cantidad:+m.cantidad, Comprobante:m.remito, 'Registró':m.usuario, Lote:lote})), 'Detalle', [16,22,28,16,14,48,10,18,18,18]);
  XLSX.writeFile(wb, `barrido_synagro_${lote}.xlsx`);
}
function dlLote(lote){ const ms = S.movs.filter(m => m.synagro_lote === lote); if(ms.length) dlBarrido(ms, lote); }
async function confirmBarrido(){
  if(!BAR) return;
  if(!BAR.bajado && !confirm('Todavía no descargaste el Excel de este barrido. ¿Cerrar el lote igual?')) return;
  const patch = {synagro_cargado:true, synagro_cargado_por:S.user.nombre, synagro_cargado_at:new Date().toISOString(), synagro_lote:BAR.lote};
  await save(async () => {
    await DB.update(T.M, BAR.ids, patch);
    S.movs.forEach(m => { if(BAR.ids.includes(m.id)) Object.assign(m, patch); });
    const n = BAR.ids.length, l = BAR.lote; BAR = null; S.cf.sel.clear(); closeModal(); render();
    toast(`Lote ${l} cerrado: ${n} ítems cargados en Synagro`);

}

/* importación desde Excel de Synagro (listado "Stock de artículos") */
let IMP = null;
const IMP_F = [
  ['codigo','Código *', [/^c[oó]d(igo)?\.?$/i, /c[oó]d/i], /barra|ean|upc|gtin/i],
  ['descripcion','Descripción *', [/^(descripci[oó]n|insumos?|art[ií]culos?|nombre|detalle)$/i, /desc|insumo|nombre|detalle|art[ií]culo/i]],
  ['codigo_barras','Código de barras', [/barra|ean|upc|gtin/i]],
  ['rubro','Rubro', [/^rubro$/i, /^(rubro|famil|categ|grupo)/i]],
  ['subrubro','Sub rubro', [/sub\s*rubro|subfamil/i]],
  ['deposito','Depósito', [/dep[oó]sito|almac[eé]n/i]],
  ['stock_synagro','Stock (existencia)', [/existencia\s*final/i, /^existencia/i, /^stock/i, /saldo\s*final/i]]
];
const cell = v => v == null ? '' : String(v).replace(/_x000D_/g, ' ').trim();
function guessMap(hd){
  const map = {}, used = new Set();
  IMP_F.forEach(([k,,res,excl]) => { for(const re of res){
    const i = hd.findIndex((x,j) => x && !used.has(j) && re.test(x) && !(excl && excl.test(x)));
    if(i >= 0){ map[k] = i; used.add(i); break; } } });
  return map;
}
function openImport(){
  IMP = null;
  modal(`<h3>Importar catálogo desde Synagro</h3>
    <p class="muted small">En Synagro exportá el listado <b>Stock de artículos</b> a Excel y subilo acá. Se actualiza por <b>código</b>: los productos existentes se actualizan y los nuevos se agregan. No se borra nada.</p>
    <input type="file" accept=".xlsx,.xls,.csv" onchange="readImport(this.files[0])"><div id="impmap" style="margin-top:14px"></div>`);
}
async function readImport(file){
  if(!file) return;
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:'', raw:true});
    let hr = rows.findIndex(r => r.some(c => /^c[oó]d/i.test(cell(c))));
    IMP = {rows, hr: hr < 0 ? 0 : hr, map:null, deps:null, depCol:null}; drawMap();
  }catch(e){ toast('No se pudo leer el archivo: ' + e.message, 'err'); }
}
function impData(){ return IMP.rows.slice(IMP.hr+1).filter(r => cell(r[IMP.map.codigo])); }
function impDepList(){
  const c = new Map(); impData().forEach(r => { const d = cell(r[IMP.map.deposito]) || '(sin depósito)'; c.set(d, (c.get(d)||0) + 1); });
  return [...c.entries()].sort((a,b) => b[1] - a[1]);
}
function drawMap(){
  const hd = (IMP.rows[IMP.hr] || []).map(cell);
  if(!IMP.map) IMP.map = guessMap(hd);
  const m = IMP.map;
  if(m.deposito != null && IMP.depCol !== m.deposito){
    IMP.depCol = m.deposito; const list = impDepList().map(x => x[0]);
    const main = list.find(d => /^dep[oó]sito$/i.test(d));
    IMP.deps = new Set(main ? [main] : list);
  }
  const opts = sel => `<option value="">— no importar —</option>` + hd.map((x,i) => `<option value="${i}" ${sel===i?'selected':''}>${h(x || 'Columna '+(i+1))}</option>`).join('');
  const data = m.codigo != null ? impData() : [];
  const uniq = new Set(data.map(r => cell(r[m.codigo]))).size;
  const prevF = IMP_F.filter(([k]) => m[k] != null);
  const depBox = m.deposito != null && m.stock_synagro != null ? `<div class="card" style="padding:12px;margin:8px 0">
      <b class="small">¿De qué depósitos sumo el stock?</b>
      <div class="muted small" style="margin:2px 0 8px">El catálogo incluye los artículos de <b>todos</b> los depósitos. El stock de referencia suma solo los tildados.
        <button class="link" onclick="IMP.deps=new Set(impDepList().map(x=>x[0]));drawMap()">Todos</button> · <button class="link" onclick="IMP.deps=new Set();drawMap()">Ninguno</button></div>
      <div style="max-height:170px;overflow:auto;columns:2;font-size:13px">${impDepList().map(([d,n]) => `<label style="display:flex;gap:6px;align-items:center;margin:0 0 4px;color:var(--ink)"><input type="checkbox" style="width:auto;margin:0" ${IMP.deps.has(d)?'checked':''} data-d="${h(d)}" onchange="this.checked?IMP.deps.add(this.dataset.d):IMP.deps.delete(this.dataset.d)">${h(d)} <span class="muted">(${n})</span></label>`).join('')}</div></div>` : '';
  document.getElementById('impmap').innerHTML = `
    <label>Fila de encabezados<input type="number" min="1" value="${IMP.hr+1}" onchange="IMP.hr=Math.max(0,(+this.value||1)-1);IMP.map=null;IMP.depCol=null;drawMap()" style="width:100px"></label>
    <div class="grid2" style="gap:4px 16px">${IMP_F.map(([k,l]) => `<label>${l}<select onchange="IMP.map['${k}']=this.value===''?undefined:+this.value;drawMap()">${opts(m[k])}</select></label>`).join('')}</div>

function parseNum(s){
  if(typeof s === 'number') return s;
  s = String(s ?? '').trim(); if(!s) return null;
  if(/^-?\d+(\.\d+)?$/.test(s)) return +s;
  if(s.includes(',') && s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.'); else s = s.replace(/,/g,'');
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
async function doImport(){
  const m = IMP.map;
  if(m.codigo == null || m.descripcion == null) return toast('Indicá qué columna es el código y cuál la descripción', 'err');
  const out = new Map(), now = new Date().toISOString();
  impData().forEach(r => {
    const codigo = cell(r[m.codigo]);
    let o = out.get(codigo);
    if(!o){
      o = {codigo, descripcion: cell(r[m.descripcion]) || codigo, actualizado_at: now};
      if(m.codigo_barras != null) o.codigo_barras = cell(r[m.codigo_barras]) || null;
      if(m.rubro != null || m.subrubro != null) o.rubro = [m.rubro!=null?cell(r[m.rubro]):'', m.subrubro!=null?cell(r[m.subrubro]):''].filter(Boolean).join(' · ') || null;
      if(m.stock_synagro != null) o.stock_synagro = 0;
      out.set(codigo, o);
    }
    if(m.stock_synagro != null){
      const dep = m.deposito != null ? (cell(r[m.deposito]) || '(sin depósito)') : null;
      if(dep == null || IMP.deps.has(dep)) o.stock_synagro += parseNum(r[m.stock_synagro]) || 0;
    }
  });
  const rows = [...out.values()];
  if(!rows.length) return toast('No se encontraron filas con código', 'err');
  await save(async () => {

    S.productos = await DB.all(T.P); indexProd(); closeModal(); render();

}

const PIN = {f:'code', code:'', pin:'', busy:false};
let PIN_ACTUAL = '';
function showPin(msg){
  S.user = null; document.getElementById('app').hidden = true;
  const L = document.getElementById('login'); L.hidden = false;

  const c = document.getElementById('pcode'), p = document.getElementById('ppin');

  p.addEventListener('input', () => { PIN.pin = p.value.replace(/\D/g,'').slice(0,4); p.value = PIN.pin; if(PIN.pin.length === 4) pinSubmit(); });
  c.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); if(PIN.code) pinField('pin'); } });
  p.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); pinSubmit(); } });
  pinField('code');
}
function pinField(f){
  PIN.f = f; const c = document.getElementById('pcode'), p = document.getElementById('ppin'); if(!c) return;
  c.classList.toggle('act', f === 'code'); p.classList.toggle('act', f === 'pin');
  const el = f === 'code' ? c : p; if(document.activeElement !== el) el.focus();
}
function pinKey(k){
  if(PIN.busy) return;
  const c = document.getElementById('pcode'), p = document.getElementById('ppin');
  document.getElementById('perr').textContent = '';
  if(k === 'OK') return PIN.f === 'code' ? (PIN.code && pinField('pin')) : pinSubmit();
  if(k === '⌫'){
    if(PIN.f === 'pin'){ if(PIN.pin) PIN.pin = PIN.pin.slice(0,-1); else return pinField('code'); }
    else PIN.code = PIN.code.slice(0,-1);
  } else if(PIN.f === 'code'){ PIN.code += k; }
  else if(PIN.pin.length < 4){ PIN.pin += k; }
  c.value = PIN.code; p.value = PIN.pin;
  if(PIN.f === 'code' && PIN.code.length >= CFG.LARGO_CODIGO) pinField('pin');
  else if(PIN.f === 'pin' && PIN.pin.length === 4) pinSubmit();
}
async function pinSubmit(){
  if(PIN.busy) return;
  if(!PIN.code) return pinField('code');
  if(PIN.pin.length !== 4){ document.getElementById('perr').textContent = 'El PIN tiene 4 dígitos'; return pinField('pin'); }
  PIN.busy = true;
  let r;
  try{ r = await AUTH.login(PIN.code, PIN.pin); }
  catch(e){ r = {ok:false, error:'Sin conexión con el servidor'}; console.error(e); }
  PIN.busy = false;
  if(!r || !r.ok){
    beep(false); PIN.pin = ''; document.getElementById('ppin').value = '';
    document.getElementById('perr').textContent = r?.error || 'Código o PIN incorrecto';
    const b = document.getElementById('pinbox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    return pinField('pin');
  }
  beep(); S.user = {id:r.id, nombre:r.nombre, rol:r.rol, token:r.token}; await start();
  if(r.cambiar_pin) openPin(true, PIN_ACTUAL = PIN.pin);
}

async function savePin(forzado){

function editOp(id){
  const o = id ? OPS.find(x => x.id === id) : {codigo:'', nombre:'', rol:'tecnico', activo:true};
  const next = id ? o.codigo : String(Math.max(0, ...OPS.map(x => parseInt(x.codigo) || 0)) + 1).padStart(CFG.LARGO_CODIGO, '0');
  modal(`<h3>${id?'Editar usuario':'Nuevo usuario'}</h3>
    <label>Código (para entrar)<input id="o_cod" inputmode="numeric" value="${h(next)}"></label>
    <label>Nombre y apellido<input id="o_nom" value="${h(o.nombre)}"></label>
    <label>Rol<select id="o_rol"><option value="tecnico" ${o.rol!=='admin'?'selected':''}>Técnico</option><option value="admin" ${o.rol==='admin'?'selected':''}>Administración</option></select></label>
    <label>PIN provisorio de 4 dígitos <span class="muted">(${id?'dejalo vacío para no cambiarlo; ':''}la persona lo cambia por uno propio al entrar)</span><input id="o_pin" inputmode="numeric" maxlength="4" autocomplete="off"></label>
    <label style="display:flex;gap:8px;align-items:center"><input id="o_act" type="checkbox" style="width:auto;margin:0" ${o.activo!==false?'checked':''}> Activo</label>
    <div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveOp(${id?`'${id}'`:'null'})">Guardar</button></div>`);
  document.getElementById(id ? 'o_pin' : 'o_nom').focus();
}
async function saveOp(id){
  const v = k => document.getElementById(k).value.trim();
  const o = {id, codigo:v('o_cod'), nombre:v('o_nom'), rol:v('o_rol'), pin:v('o_pin'), activo:document.getElementById('o_act').checked};
  if(!/^\d{1,8}$/.test(o.codigo)) return toast('El código tiene que ser numérico', 'err');
  if(!o.nombre) return toast('Escribí el nombre', 'err');
  if(o.pin && !/^\d{4}$/.test(o.pin)) return toast('El PIN tiene que ser de 4 números', 'err');
  if(!id && !o.pin) return toast('Asigná un PIN', 'err');
  if(OPS.some(x => x.codigo === o.codigo && x.id !== id)) return toast('Ese código ya está en uso', 'err');
  await save(async () => { await AUTH.guardar(o); closeModal(); toast('Usuario guardado'); S.tecnicos = await AUTH.tecnicos(); await loadOps(); });
}
function printCred(id){
  const o = OPS.find(x => x.id === id); if(!o) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  try{ JsBarcode(svg, o.codigo, {format:'CODE128', width:2.4, height:50, fontSize:14, margin:0}); }
  catch(e){ return toast('No se pudo generar el código de barras', 'err'); }
  printHTML('Credencial ' + o.codigo, `<div class="cred"><div class="e">${h(CFG.EMPRESA)}</div><div class="n">${h(o.nombre)}</div><div class="r">${o.rol==='admin'?'Administración':'Técnico'} · Stock en Campo</div>${svg.outerHTML}</div>`,
    `body{font-family:Arial,sans-serif;margin:10mm}.cred{width:85mm;height:54mm;border:1px solid #999;border-radius:3mm;padding:4mm;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
     .e{font-size:8pt;color:#555}.n{font-size:14pt;font-weight:bold}.r{font-size:8pt;color:#555}.cred svg{max-width:100%;height:auto;max-height:22mm}`);
}

async function init(){
  if(DEMO){
    document.getElementById('demo').hidden = false; seedDemo(); seedOps(); showPin();
  } else {
    const {data} = await sb.auth.getSession();
    if(data.session) showPin(); else showDevice();
  }
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !PIN_ACTUAL) closeModal(); });
init();
</script>
</body>
</html>
